version: "3.7"

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: jarvis_n8n
    restart: always
    ports:
      # Bind to loopback only so n8n is never exposed on the network.
      - "127.0.0.1:5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Asia/Kolkata
      # Authentication is enabled. Provide credentials via a .env file next to
      # this compose file (see .env.example). Do NOT disable auth.
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
