name: Python smoke checks
on:
  push:
  pull_request:
jobs:
  syntax-and-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python source
        run: python -m compileall -q .
      - name: Test CLI bootstrap
        run: python -m unittest discover -s tests -p 'test_startup_cli.py' -v
