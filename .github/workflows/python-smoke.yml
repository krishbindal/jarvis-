name: Python smoke and Windows dependency checks
on:
  push:
  pull_request:
jobs:
  portable-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile source
        run: python -m compileall -q .
      - name: Bootstrap and configuration unit tests
        run: python -m unittest discover -s tests -p 'test_startup_cli.py' -v && python -m unittest discover -s tests -p 'test_config_validation.py' -v
  windows-dependencies:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install full Windows dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Validate resolved dependencies
        run: python -m pip check
      - name: Compile source
        run: python -m compileall -q .
      - name: Run all unit tests
        run: python -m unittest discover -s tests -v
