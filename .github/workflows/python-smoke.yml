name: Python smoke and Windows dependency checks
on:
  push:
  pull_request:
jobs:
  portable-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Compile source
        run: python -m compileall -q .
      - name: Bootstrap and configuration unit tests
        run: python -m unittest discover -s tests -p 'test_startup_cli.py' -v && python -m unittest discover -s tests -p 'test_config_validation.py' -v
  windows-dependencies:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints-win311.txt
      - name: Install verified direct-dependency versions
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -c constraints-win311.txt
      - name: Validate resolved dependencies
        run: python -m pip check
      - name: Compile source
        run: python -m compileall -q .
      - name: Run all unit tests
        run: python -m unittest discover -s tests -v
      - name: Capture exact resolved installed package versions
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          python -m pip freeze --all | Out-File -FilePath artifacts/windows-py311-freeze.txt -Encoding utf8
      - name: Measure real headless Qt startup and process memory
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/ci_headless_benchmark.py
      - name: Upload measured CI metrics and dependency freeze
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: windows-py311-observed-ci
          path: artifacts/
          if-no-files-found: warn
